<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta Move | Mudanças Premium em Portugal</title>
  <meta
    name="description"
    content="Delta Move - Mudanças premium, transporte, embalamento e soluções personalizadas em Portugal. Peça o seu orçamento de forma rápida e profissional."
  />
  <meta name="theme-color" content="#0b5fff" />

  <style>
    :root {
      --primary: #0b5fff;
      --primary-dark: #083ea7;
      --primary-soft: #dbe8ff;
      --secondary: #c9d0db;
      --silver: #eef2f7;
      --silver-strong: #b8c2cf;
      --dark: #0f172a;
      --dark-2: #111827;
      --text: #1f2937;
      --text-light: #5b6472;
      --white: #ffffff;
      --line: rgba(15, 23, 42, 0.10);
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
      --shadow-strong: 0 25px 60px rgba(11, 95, 255, 0.16);
      --radius: 22px;
      --radius-sm: 14px;
      --transition: all 0.30s ease;
      --max: 1220px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(11, 95, 255, 0.08), transparent 30%),
        radial-gradient(circle at left bottom, rgba(138, 146, 166, 0.10), transparent 25%),
        linear-gradient(180deg, #f9fbff 0%, #eef2f7 42%, #ffffff 100%);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    .container {
      width: min(92%, var(--max));
      margin: 0 auto;
    }

    .section {
      padding: 90px 0;
      position: relative;
    }

    .section-title-wrap {
      text-align: center;
      max-width: 820px;
      margin: 0 auto 50px;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(11, 95, 255, 0.12), rgba(201, 208, 219, 0.45));
      color: var(--primary-dark);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 16px;
      border: 1px solid rgba(11, 95, 255, 0.10);
    }

    h1, h2, h3, h4 {
      line-height: 1.2;
      color: var(--dark);
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .section-text {
      font-size: 1.05rem;
      color: var(--text-light);
    }

    .topbar {
      background: linear-gradient(90deg, var(--dark), #1e293b);
      color: #dbe4f0;
      padding: 10px 0;
      font-size: 0.92rem;
    }

    .topbar .container {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
    }

    .topbar span strong {
      color: var(--white);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    }

    .navbar {
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
      border-radius: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-text strong {
      font-size: 1.35rem;
      color: var(--dark);
      letter-spacing: 0.4px;
    }

    .brand-text span {
      font-size: 0.86rem;
      color: var(--text-light);
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-menu a {
      font-size: 0.97rem;
      font-weight: 700;
      color: var(--dark);
      transition: var(--transition);
      position: relative;
    }

    .nav-menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), #7db7ff);
      transition: var(--transition);
      border-radius: 999px;
    }

    .nav-menu a:hover {
      color: var(--primary);
    }

    .nav-menu a:hover::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.96rem;
      transition: var(--transition);
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4da0ff);
      color: var(--white);
      box-shadow: var(--shadow-strong);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      filter: brightness(1.03);
    }

    .btn-secondary {
      background: rgba(11, 95, 255, 0.08);
      color: var(--primary-dark);
      border: 1px solid rgba(11, 95, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(11, 95, 255, 0.12);
      transform: translateY(-3px);
    }

    .btn-dark {
      background: linear-gradient(135deg, var(--dark), #334155);
      color: var(--white);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
    }

    .btn-dark:hover {
      transform: translateY(-3px);
    }

    .menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: var(--white);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--dark);
    }

    .hero {
      padding: 90px 0 70px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 580px;
      height: 580px;
      right: -180px;
      top: -180px;
      background: radial-gradient(circle, rgba(11, 95, 255, 0.16), transparent 62%);
      pointer-events: none;
      z-index: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 460px;
      height: 460px;
      left: -130px;
      bottom: -100px;
      background: radial-gradient(circle, rgba(184, 194, 207, 0.24), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      align-items: center;
      gap: 36px;
      position: relative;
      z-index: 1;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      color: var(--primary-dark);
      font-weight: 700;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .hero h1 .gradient {
      background: linear-gradient(90deg, var(--primary), #79b7ff 50%, #7f8896 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.08rem;
      color: var(--text-light);
      max-width: 650px;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .hero-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .mini-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(15, 23, 42, 0.08);
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.05);
      backdrop-filter: blur(10px);
    }

    .mini-card strong {
      display: block;
      font-size: 1.2rem;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .mini-card span {
      color: var(--text-light);
      font-size: 0.92rem;
    }

    .hero-visual {
      position: relative;
    }

    .hero-panel {
      position: relative;
      min-height: 620px;
      border-radius: 32px;
      padding: 28px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.92), rgba(236,242,249,0.94)),
        linear-gradient(135deg, #ffffff, #edf3ff);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: var(--shadow);
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(11, 95, 255, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(129, 140, 151, 0.18), transparent 30%);
      pointer-events: none;
    }

    .hero-logo-box {
      position: relative;
      z-index: 2;
      background: linear-gradient(145deg, #0b1220, #1e293b);
      border-radius: 26px;
      padding: 28px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.35);
      overflow: hidden;
    }

    .hero-logo-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(11, 95, 255, 0.16), transparent 40%),
        linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
      pointer-events: none;
    }

    .hero-logo-box img {
      max-height: 260px;
      object-fit: contain;
      z-index: 2;
      position: relative;
      filter: drop-shadow(0 20px 40px rgba(11,95,255,0.25));
    }

    .floating-card {
      position: absolute;
      z-index: 3;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 18px;
    }

    .floating-card h4 {
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .floating-card p {
      font-size: 0.88rem;
      color: var(--text-light);
      margin: 0;
    }

    .floating-1 {
      top: 235px;
      right: -18px;
      width: 220px;
    }

    .floating-2 {
      left: -26px;
      bottom: 80px;
      width: 230px;
    }

    .floating-3 {
      right: 24px;
      bottom: 24px;
      width: 200px;
    }

    .hero-list {
      position: relative;
      z-index: 2;
      margin-top: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .hero-list li {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(15, 23, 42, 0.06);
      padding: 16px 18px;
      border-radius: 16px;
      font-weight: 700;
      color: var(--dark);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.04);
    }

    .trust-bar {
      margin-top: 18px;
    }

    .trust-wrap {
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(15,23,42,0.98), rgba(30,41,59,0.98));
      color: var(--white);
      padding: 26px 28px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.18);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .trust-item {
      padding: 8px 10px;
    }

    .trust-item strong {
      display: block;
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .trust-item span {
      color: #cfd8e6;
      font-size: 0.95rem;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .service-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), #87bfff, #d1d7df);
    }

    .service-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 30px 70px rgba(11, 95, 255, 0.12);
    }

    .icon-box {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(11,95,255,0.14), rgba(201,208,219,0.38));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 18px;
      color: var(--primary-dark);
      border: 1px solid rgba(11, 95, 255, 0.10);
    }

    .service-card h3 {
      font-size: 1.3rem;
      margin-bottom: 12px;
    }

    .service-card p {
      color: var(--text-light);
      margin-bottom: 14px;
    }

    .service-card ul {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .service-card li {
      color: var(--dark);
      position: relative;
      padding-left: 18px;
      font-size: 0.96rem;
    }

    .service-card li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--primary);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 34px;
      align-items: center;
    }

    .about-image {
      position: relative;
      min-height: 560px;
      border-radius: 32px;
      overflow: hidden;
      background:
        linear-gradient(140deg, rgba(9, 17, 32, 0.97), rgba(26, 36, 53, 0.97)),
        linear-gradient(135deg, #091120, #253348);
      box-shadow: var(--shadow);
      border: 1px solid rgba(15, 23, 42, 0.10);
      padding: 28px;
    }

    .about-overlay-card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 22px 55px rgba(0,0,0,0.18);
      max-width: 320px;
      margin-top: 250px;
      position: relative;
      z-index: 2;
    }

    .about-overlay-card strong {
      display: block;
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .about-overlay-card p {
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .about-shine {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(11,95,255,0.38), transparent 60%);
      top: 20px;
      right: -80px;
      filter: blur(10px);
    }

    .about-lines {
      position: absolute;
      left: 28px;
      top: 34px;
      right: 28px;
      height: 180px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.10);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
    }

    .about-content h2 {
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 18px;
    }

    .about-content p {
      color: var(--text-light);
      margin-bottom: 16px;
      font-size: 1.02rem;
    }

    .about-points {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 26px 0 32px;
    }

    .point {
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: 0 12px 28px rgba(15,23,42,0.05);
    }

    .point strong {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .point span {
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .step-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(245,248,252,0.96));
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .step-number {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), #8bc1ff);
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 16px 30px rgba(11,95,255,0.18);
    }

    .step-card h3 {
      margin-bottom: 12px;
      font-size: 1.18rem;
    }

    .step-card p {
      color: var(--text-light);
      font-size: 0.96rem;
    }

    .areas-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 26px;
    }

    .areas-box,
    .coverage-box {
      background: rgba(255,255,255,0.92);
      border-radius: 28px;
      padding: 30px;
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: var(--shadow);
    }

    .areas-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 24px;
    }

    .area-pill {
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(11,95,255,0.08), rgba(201,208,219,0.24));
      border: 1px solid rgba(11,95,255,0.08);
      text-align: center;
      font-weight: 700;
      color: var(--dark);
    }

    .coverage-box h3,
    .areas-box h3 {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    .coverage-box p,
    .areas-box p {
      color: var(--text-light);
    }

    .coverage-features {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 26px;
    }

    .coverage-item {
      padding: 16px 18px;
      border-radius: 18px;
      background: #f8fbff;
      border: 1px solid rgba(15,23,42,0.06);
      font-weight: 700;
      color: var(--dark);
    }

    .fleet-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .fleet-card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .fleet-card:hover {
      transform: translateY(-8px);
    }

    .fleet-card h3 {
      margin-bottom: 12px;
      font-size: 1.25rem;
    }

    .fleet-card p {
      color: var(--text-light);
      margin-bottom: 18px;
    }

    .fleet-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .fleet-tags span {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(11,95,255,0.08);
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid rgba(11,95,255,0.08);
    }

    .quote-section {
      position: relative;
      overflow: hidden;
    }

    .quote-section::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(11,95,255,0.12), transparent 26%),
        radial-gradient(circle at bottom left, rgba(184,194,207,0.18), transparent 28%);
      pointer-events: none;
    }

    .quote-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .quote-content,
    .quote-box {
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 28px;
      padding: 34px;
      box-shad
